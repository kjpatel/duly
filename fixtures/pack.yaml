# FICTIONAL. This pack governs an invented domain and cites no real authority.
# It exists so duly's own suites can test toolkit behaviour without reaching
# into the teaching content under examples/ — see fixtures/README.md.
#
# Deliberately not realistic: a reader who mistook this for a demonstration
# would learn something false. Every citation says so in its own text.

pack:
  name: duly-fixture-pack
  version: "2026.3.0"
  ontology: duly-fixture
  ontologyVersion: "0.1.0"
  idPrefix: FX

abstentionPolicy:
  minConfidence: 0.80
  routeTo: fixture-review
  # A per-attribute floor, and the only *nested* structure in this pack's
  # top-level keys. That is what it is here for: the rule studio re-emits a
  # structured edit through `duly_dmn.emit.emit_pack`, and a key dropped there
  # produces a draft that validates, adjudicates, and answers differently —
  # silently. Two scalars cannot catch a flattening; a mapping under a mapping
  # can. Set above the global floor so it is the binding constraint for this
  # attribute, and above every committed fixture's category confidence (1.0),
  # so raising it is a decision change rather than a no-op.
  attributes:
    fx:category: 0.95

decisions:
  - attribute: fx:permitted
    entityType: fx:Widget
    question: "Is this widget permitted?"

  # A NON-BOOLEAN decision, carried so the fixtures exercise the phrasing path.
  # A boolean decision gets the kernel's Yes/No fallback and never reaches a
  # `phrasing:` block, so a fixture pack without one of these leaves every
  # placeholder, tone and guard in that machinery untested — and the demo's
  # rule that verdict wording is *pack data* untestable except through the
  # teaching packs.
  - attribute: fx:assessedFee
    entityType: fx:Widget
    question: "What fee is assessed?"
    phrasing:
      # `amount: positive` is how a *money* decision is guarded — its value is
      # an amount and a currency, not a scalar, so `value:` matches nothing
      # here. Written the wrong way first, and the demo silently fell through
      # to the unguarded case rather than complaining, which is exactly the
      # kind of quiet mis-authoring a fixture should exercise once.
      - when: { amount: positive }
        verdict: "Fee assessed"
        detail: "{money} owed on this widget"
        tone: warn
      - verdict: "No fee"
        detail: "Nothing is owed on this widget"
        tone: pos

rules:
  # The default presumption. Lowest priority, fires for every widget.
  - id: FX-DEFAULT-00
    version: "1.0.0"
    priority: 0
    citation: { text: "Fixture default presumption (fictional)" }
    effectiveFrom: "1900-01-01"
    given:
      widget: { entityType: fx:Widget }
    then:
      entity: widget
      attribute: fx:permitted
      value: { kind: boolean, value: true }

  # A derived intermediate, so the derivation tree has depth: the threshold a
  # widget is measured against is itself concluded by a rule rather than
  # written into a guard as a literal.
  - id: FX-THRESHOLD-01
    version: "1.0.0"
    priority: 100
    citation: { text: "Fixture threshold, pre-2026 edition (fictional)" }
    effectiveFrom: "1900-01-01"
    effectiveTo: "2026-01-01"
    given:
      widget: { entityType: fx:Widget }
    then:
      entity: widget
      attribute: fx:requiredMinimumScore
      value: { kind: decimal, value: "10" }

  # The effective-dated pair of the rule above: same conclusion, later window,
  # stricter number. This is what makes as-of replay testable here.
  - id: FX-THRESHOLD-02
    version: "1.0.0"
    priority: 100
    citation: { text: "Fixture threshold, 2026 edition (fictional)" }
    effectiveFrom: "2026-01-01"
    given:
      widget: { entityType: fx:Widget }
    then:
      entity: widget
      attribute: fx:requiredMinimumScore
      value: { kind: decimal, value: "50" }

  # The exception. Outranks the default and defeats it explicitly, so every
  # receipt it appears in carries a non-empty `defeated` list.
  - id: FX-EXCEPTION-01
    version: "1.0.0"
    priority: 200
    citation:
      text: "Fixture exception (fictional)"
      url: "https://example.invalid/fixture/exception-01"
    effectiveFrom: "1900-01-01"
    overrides: [FX-DEFAULT-00]
    given:
      widget:   { entityType: fx:Widget }
      score:    { attribute: fx:score }
      category: { attribute: fx:category }
      minimum:  { derived: fx:requiredMinimumScore }
    when:
      - score < minimum
      - category == "restricted"
    then:
      entity: widget
      attribute: fx:permitted
      value: { kind: boolean, value: false }

  # The fee the non-boolean decision reports. A default and its exception, at
  # differing priorities with an explicit `overrides` — the same shape as the
  # pair above, because that is the shape the IR is built around.
  - id: FX-FEE-00
    version: "1.0.0"
    priority: 0
    citation: { text: "Fixture fee schedule (fictional)" }
    effectiveFrom: "1900-01-01"
    given:
      widget: { entityType: fx:Widget }
    then:
      entity: widget
      attribute: fx:assessedFee
      value: { kind: money, amount: "0.00", currency: USD }

  - id: FX-FEE-01
    version: "1.0.0"
    priority: 100
    citation: { text: "Fixture fee for a restricted widget (fictional)" }
    effectiveFrom: "1900-01-01"
    overrides: [FX-FEE-00]
    given:
      widget:   { entityType: fx:Widget }
      score:    { attribute: fx:score }
      category: { attribute: fx:category }
      minimum:  { derived: fx:requiredMinimumScore }
    when:
      - score < minimum
      - category == "restricted"
    then:
      entity: widget
      attribute: fx:assessedFee
      value: { kind: money, amount: "250.00", currency: USD }
