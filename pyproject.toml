[project]
name = "duly"
version = "0.0.1"
description = "Auditable document decisioning for regulated workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Heavy (pulls torch et al.); the core suite never needs it. Install with
# `uv sync --extra extraction` to run the live Docling adapter and its
# @pytest.mark.docling tests.
extraction = [
    "docling>=2.0",
]
# The Z3 static pack verifier (`python -m duly_assurance prove`). Optional
# because it is a validation-time analysis tool: the kernel, the corpus, and
# every receipt are produced without it. Install with `uv sync --extra prove`
# or run ad hoc with `uv run --with z3-solver`; its @pytest.mark.z3 tests skip
# when z3 is not importable.
prove = [
    "z3-solver>=4.12",
]

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.0",
    "httpx>=0.27",
    "pyld>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel/duly_kernel", "store/duly_store", "assurance/duly_assurance", "calibration/duly_calibration", "extraction/duly_extraction", "review/duly_review", "conformance/duly_conformance", "dmn/duly_dmn"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "docling: exercises the live Docling converter; requires `uv sync --extra extraction` (skipped when docling is not importable)",
    "linkml: proves the committed ontologies are genuine LinkML with real tooling; run via `uv run --with linkml --with pyshacl pytest conformance/tests -m linkml` (skipped when linkml is not importable)",
    "z3: exercises the Z3 static pack verifier; run via `uv run --with z3-solver pytest assurance/tests -m z3` (skipped when z3 is not importable)",
]
