# The adoption check: does duly work when it is not at home?
#
# Every other job in this repository runs the toolkit inside its own source
# tree, where every assumption about where files live happens to be true.
# This one builds a wheel, installs it into a clean virtualenv, copies the
# minimal-integration example somewhere else entirely, and runs it with the
# source tree off sys.path. It is the only job that can fail because of a
# repo-relative default.
#
# It needs no optional dependencies, so it is a plain job rather than a
# marker-gated one in optional-deps.yml.
name: Minimal integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "examples/minimal-integration/**"
      - "core/**"
      - "kernel/**"
      - "conformance/**"
      - "store/**"
      - "review/**"
      - "calibration/**"
      - "extraction/**"
      - "assurance/**"
      - "dmn/**"
      - "pyproject.toml"
      - ".github/workflows/minimal-integration.yml"
      - ".github/scripts/wheel_smoke.py"

jobs:
  wheel:
    name: Run the example from an installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Run the example against a built wheel, outside the repository
        run: ./examples/minimal-integration/check_wheel.sh

  smoke:
    # The example covers duly_kernel and duly_conformance. This covers the rest,
    # because a package that needs a file the wheel does not carry is invisible
    # to every other job in this repository — where the file is always there.
    name: Every shipped package works from a wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install it into a clean venv
        run: |
          python3 -m venv /tmp/smoke-venv
          # `[demo,report]`, because this job smokes every *surface* the wheel
          # ships, and two of them are behind extras: `duly_demo` cannot import
          # without fastapi, and the PDF report cannot render without
          # reportlab. That the bare install omits them is the point of the
          # extras and is asserted elsewhere — `check_wheel.sh` pins the bare
          # closure at two packages. Here the job's question is the opposite
          # one: given the extras, does every package work outside the repo?
          #
          # jsonschema rides in [project] dependencies since 1.0.0 (C6
          # enforcement is core, DECIDED at the packaging pause) — the smoke
          # no longer installs it separately.
          /tmp/smoke-venv/bin/pip install --quiet "$(ls dist/duly-*.whl)[demo,report]"

      - name: Smoke every package from outside the repository
        run: |
          cp .github/scripts/wheel_smoke.py /tmp/wheel_smoke.py
          cd /tmp && env -u PYTHONPATH /tmp/smoke-venv/bin/python /tmp/wheel_smoke.py

      # A [project.scripts] entry pointing at a broken module:function would
      # pass every import-level check silently — the console shim is only
      # exercised by running it. Asserting the command's own name in its
      # usage line also catches a parser whose prog= still claims to be
      # `python -m ...`.
      - name: Every console script answers --help under its own name
        run: |
          for cmd in duly-verify duly-impact duly-conformance duly-dmn duly-whatif; do
            out=$(env -u PYTHONPATH "/tmp/smoke-venv/bin/$cmd" --help)
            echo "$out" | head -1
            echo "$out" | grep -q "$cmd" || { echo "usage line does not name $cmd"; exit 1; }
          done
