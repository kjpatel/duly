[project]
name = "duly"
# The DISTRIBUTION version: it moves on any release of anything in the wheel,
# including a release that does not touch the kernel at all. Bump it freely.
#
# Nothing else follows it, and nothing else should be made to. In particular
# the receipt's `engine.version` is a decision-semantics version pinned as
# `duly_kernel.receipt.SEMANTICS_VERSION`, sealed inside all 351 golden receipt
# hashes; aligning it with this number would invalidate every one of them
# without a rule, a fact, or a decision having changed. See the comment there
# before "tidying up" the version numbers that read 0.0.1 across this repo.
version = "1.0.0"
description = "Auditable document decisioning for regulated workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The document→receipt path, and nothing else. A rule pack is YAML, so the
# kernel needs a YAML parser; everything past that — the HTTP surfaces, the PDF
# renderer, the solvers, the extraction stack — is a *surface* built on the
# path rather than part of it, and lives in an extra below. An adopter
# embedding the kernel inherits one third-party package and its surface, which
# is the strongest claim SECURITY.md's dependency section can make.
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
# The five decided at the M5 packaging ASK (docs/m5-plan.md, DECIDED
# 2026-08-06). duly-verify and duly-impact bypass the duly_assurance
# dispatcher and bind the subcommand mains directly; generate, prove and
# prove-equivalent remain `python -m duly_assurance <sub>` only.
duly-verify = "duly_assurance.verify:main"
duly-impact = "duly_assurance.impact:main"
duly-conformance = "duly_conformance.__main__:main"
duly-dmn = "duly_dmn.__main__:main"
duly-whatif = "duly_whatif.__main__:main"

[project.optional-dependencies]
# The two HTTP surfaces: the demo workspace (`duly_demo`, four pages) and the
# review queue's API (`duly_review.api`). One extra covers both because they
# are one dependency — FastAPI and an ASGI server — not because the review API
# is part of the demo. `import duly_review` does not reach `api.py`; only
# `duly_review.api` does, so the queue itself stays installable without this.
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# The kernel's PDF audit report (`duly_kernel.report.render_report_pdf`, and
# the demo's `/api/receipts/report.pdf` route that calls it). Lazily imported
# inside the render function, so `import duly_kernel` never touches it and both
# call sites already degrade honestly when it is absent.
report = [
    "reportlab>=4.0",
]
# Heavy (pulls torch et al.); the core suite never needs it. Install with
# `uv sync --extra extraction` to run the live Docling adapter and its
# @pytest.mark.docling tests.
extraction = [
    "docling>=2.0",
]
# The Z3 static pack verifier (`python -m duly_assurance prove`) and the
# what-if solver (`python -m duly_whatif`). Optional because both are
# validation-time analysis tools: the kernel, the corpus, and every receipt
# are produced without them. Install with `uv sync --extra prove` or run ad
# hoc with `uv run --with z3-solver`; their @pytest.mark.z3 tests skip when
# z3 is not importable.
prove = [
    "z3-solver>=4.12",
]
# There is deliberately no `scheduling` extra. CP-SAT belongs to an *example*
# of embedding duly, not to duly, so its declaration lives in the example and
# deletes with it: `examples/closing-scheduler/schedule.py` carries PEP 723
# inline script metadata (`uv run examples/closing-scheduler/schedule.py`
# resolves ortools by itself) and its suite runs as
# `uv run --with ortools pytest examples/closing-scheduler -q -m ortools`.
# An extra here would have made the root project the declaration site for a
# dependency `git rm -r examples/` is supposed to take with it.

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.0",
    "httpx>=0.27",
    "pyld>=2.0",
    # fastapi, uvicorn and reportlab appear here as well as in the `demo` and
    # `report` extras above, and the duplication is the design. The extras gate
    # the *wheel consumer*: `pip install duly` gets the kernel and nothing
    # else. This group serves the *repository*: `uv sync` installs it, so every
    # developer and every CI lane keeps working with the single command they
    # already run, and no suite grows a skip for a dependency the repo always
    # has. These are three light packages (reportlab's whole closure is three),
    # which is why they ride the dev group rather than becoming pytest markers
    # — markers are for heavy deps the repo genuinely cannot assume (docling,
    # z3, ortools). Bumping a floor means bumping it in both places.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/duly_core", "kernel/duly_kernel", "store/duly_store", "assurance/duly_assurance", "calibration/duly_calibration", "extraction/duly_extraction", "review/duly_review", "conformance/duly_conformance", "dmn/duly_dmn", "whatif/duly_whatif", "duly_demo"]

# `duly_demo` is the one entry whose directory sits at the repository root
# rather than inside a component directory. Every other package is
# `<component>/<package>`; the demo surfaces have no component wrapper, so the
# package directory *is* the top-level directory and the entry is bare.
#
# Its `static/` tree (pages, JS, CSS, fonts) is data the package cannot run
# without: `duly_demo.app` mounts it with `StaticFiles` in its module body, so
# a wheel that shipped the code and dropped the assets fails at import. That is
# what `.github/scripts/wheel_smoke.py`'s `duly_demo` check exists to catch.
#
# The same rootedness is why this is the only target needing an `exclude`.
# Every other package keeps its suite in a sibling directory (`kernel/tests`
# beside `kernel/duly_kernel`), so no suite is inside a package and none can
# be swept into the wheel. `duly_demo/tests` is inside one, and would ship to
# every adopter without this — as would `duly_demo/CLAUDE.md`, which is
# guidance for agents editing this directory, not for anyone importing it.
exclude = ["duly_demo/tests", "duly_demo/CLAUDE.md"]


[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "docling: exercises the live Docling converter; requires `uv sync --extra extraction` (skipped when docling is not importable)",
    "linkml: proves the committed ontologies are genuine LinkML with real tooling; run via `uv run --with linkml --with pyshacl pytest conformance/tests -m linkml` (skipped when linkml is not importable)",
    "z3: exercises the Z3 static pack verifier; run via `uv run --with z3-solver pytest assurance/tests whatif/tests duly_demo/tests -m z3` (skipped when z3 is not importable)",
    "ortools: exercises the CP-SAT closing scheduler example; run via `uv run --with ortools pytest examples/closing-scheduler -m ortools` (skipped when ortools is not importable)",
]
