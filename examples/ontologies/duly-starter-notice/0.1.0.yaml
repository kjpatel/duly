# duly-starter-notice 0.1.0 — the insurance-notice domain model the starter
# corpus cites.
#
# HONEST LABELING: this is the ontology a *user of the starters* brought to
# duly, not one duly defines — duly ships no domain terms (README, "Why
# bring-your-own ontology"). It describes exactly the terms the committed
# insurance facts and the termination-notice rule pack use, nothing more.
# The name and version are load-bearing: every committed insurance fact —
# including golden/cases/review-0001, the repo's only preserved-forever
# human-provenance case — pins `schemaRef: {ontology: duly-starter-notice,
# version: "0.1.0"}` inside its content hash, so this artifact keeps the
# name those facts already cite. A real insurance deployment would model
# this domain against ACORD's forms and data standards; ACORD's standards
# are membership-gated, so no ACORD-derived content is committed here and
# terms carry no ACORD references (see ontologies/README.md).
#
# This file is genuine LinkML (proven by the marker-gated tests in
# examples/tests/test_real_linkml.py). The enforcing validator,
# duly_conformance, interprets the constrained subset documented in
# spec/ontology-conformance.md; everything else in this file is
# documentation the gate deliberately ignores.
#
# IMMUTABLE once committed, like a rule-pack version: a fact citing 0.1.0
# validates against 0.1.0 forever. Changes go in a new version file.
id: https://duly.dev/ontologies/duly-starter-notice/0.1.0
name: duly-starter-notice
version: 0.1.0
description: >-
  Property-insurance termination notices: the policy under notice and the
  notice itself, as extracted from declarations pages and nonrenewal
  notices in the starter corpus. Derived decision attributes concluded by
  rulepacks/termination-notice-us-states are declared here too, marked
  derived, so receipts are covered by the same vocabulary as inputs.
license: https://www.apache.org/licenses/LICENSE-2.0

prefixes:
  linkml: https://w3id.org/linkml/
  duly: https://duly.dev/spec/v0/vocab#
  nc: https://duly.dev/ontologies/duly-starter-notice/nc#
  dsn: https://duly.dev/ontologies/duly-starter-notice/
default_prefix: dsn
default_range: string

imports:
  - linkml:types

enums:
  StateOrSubdivisionCode:
    description: >-
      ISO 3166-2 country subdivisions (e.g. US-NY). An OPEN code set: the
      standard is external and its membership is not vendored here, so the
      conformance gate checks the code system identity but not membership.
    code_set: urn:iso:std:iso:3166:-2
    annotations:
      codeSystem: iso-3166-2
      openCodeSet: true

  NoticeType:
    description: >-
      The kind of termination notice. Only the values the starter corpus
      and the rule pack actually use are enumerated — an unlisted value is
      a gate rejection, not a silent pass.
    annotations:
      codeSystem: duly-starter-notice/notice-types
    permissible_values:
      Nonrenewal:
        description: The insurer declines to renew at policy expiration.

  TerminationGround:
    description: The insurer's stated ground for termination.
    annotations:
      codeSystem: duly-starter-notice/termination-grounds
    permissible_values:
      Nonpayment:
        description: Nonpayment of premium.

classes:
  Policy:
    class_uri: nc:Policy
    description: The insurance policy a termination notice concerns.
    attributes:
      governingState:
        slot_uri: nc:governingState
        range: StateOrSubdivisionCode
        description: >-
          The state whose insurance law governs the policy, read from the
          declarations page.
      policyExpirationDate:
        slot_uri: nc:policyExpirationDate
        range: date
        description: The policy period's end date.

  TerminationNotice:
    class_uri: nc:TerminationNotice
    description: A cancellation or nonrenewal notice sent to the insured.
    attributes:
      noticeType:
        slot_uri: nc:noticeType
        range: NoticeType
        description: What kind of termination the notice effects.
      noticeMailedDate:
        slot_uri: nc:noticeMailedDate
        range: date
        description: The date the notice was mailed, from the notice face.
      terminationGround:
        slot_uri: nc:terminationGround
        range: TerminationGround
        description: The stated ground for termination, when one is given.
      noticeCompliant:
        slot_uri: nc:noticeCompliant
        range: boolean
        description: >-
          DERIVED — concluded by rulepacks/termination-notice-us-states,
          never extracted. Whether the notice met the governing state's
          minimum-notice requirement.
        annotations:
          derived: true
      requiredMinimumNoticeDays:
        slot_uri: nc:requiredMinimumNoticeDays
        range: decimal
        description: >-
          DERIVED — the minimum notice period (days) the governing state
          required for this notice.
        annotations:
          derived: true
