# Expected kernel outcomes for notarization-ron-us-states.
# Auto-run by kernel/tests/test_rulepacks.py: each case evaluates the pack
# against the facts in factsFrom at the given asOfEffective date.
#
# The vertical exists to showcase effective-dated replay against REAL
# statutory history: state RON authorizations commenced on documented,
# different dates (VA 2012-07-01, TX 2018-07-01, FL 2020-01-01,
# NY 2023-01-31, CA no later than 2030-01-01), so the same facts flip as the
# asOf dial crosses each date.
cases:
  # ---- The centerpiece flip: California, signed law that is not yet operative.
  # The starter closing was notarized by remote online audio-visual means in
  # California. Adjudicated today, CA-RON-2030 (effectiveFrom 2030-01-01, the
  # Online Notarization Act's statutory outside operative date) is not in
  # force, so the fail-closed default RON-DEF-00 holds and RON-COMP-01 finds
  # the notarization noncompliant.
  - name: ca-ron-closing-2026-not-permitted
    factsFrom: starters/ron-closing/facts
    asOfEffective: "2026-07-29"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  - name: ca-ron-closing-2026-noncompliant
    factsFrom: starters/ron-closing/facts
    asOfEffective: "2026-07-29"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  # Same facts, asOf moved to the Online Notarization Act's outside operative
  # date: CA-RON-2030 is in force, defeats the fail-closed default, and the
  # RON becomes permitted — so RON-COMP-01 no longer fires and the compliance
  # presumption survives.
  - name: ca-ron-closing-2030-permitted
    factsFrom: starters/ron-closing/facts
    asOfEffective: "2030-01-01"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [CA-RON-2030, RON-COMP-00]
    expectDefeated:
      CA-RON-2030: [RON-DEF-00]

  - name: ca-ron-closing-2030-compliant
    factsFrom: starters/ron-closing/facts
    asOfEffective: "2030-01-01"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [CA-RON-2030, RON-COMP-00]
    expectDefeated:
      CA-RON-2030: [RON-DEF-00]

  # ---- Virginia: both boundary sides of the first RON authorization in the
  # country (2011 Acts cc. 731, 834, commencing July 1, 2012). The day before
  # commencement the same facts fail closed; on the commencement day itself
  # ([effectiveFrom, effectiveTo) is inclusive of the lower bound) they flip.
  - name: va-ron-day-before-2012-authorization
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/va-ron-closing/facts
    asOfEffective: "2012-06-30"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  - name: va-ron-first-effective-day-permitted
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/va-ron-closing/facts
    asOfEffective: "2012-07-01"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [VA-RON-2012, RON-COMP-00]
    expectDefeated:
      VA-RON-2012: [RON-DEF-00]

  # ---- Texas: HB 1217's own clause reads "This Act takes effect July 1,
  # 2018"; a Texas RON on the commencement day is compliant.
  - name: tx-ron-2018-compliant
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/tx-ron-closing/facts
    asOfEffective: "2018-07-01"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [TX-RON-2018, RON-COMP-00]
    expectDefeated:
      TX-RON-2018: [RON-DEF-00]

  # ---- Florida: both boundary sides of ch. 2019-71's January 1, 2020
  # commencement, asked as the compliance question.
  - name: fl-ron-2019-noncompliant
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/fl-ron-closing/facts
    asOfEffective: "2019-12-31"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  - name: fl-ron-2020-compliant
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/fl-ron-closing/facts
    asOfEffective: "2020-01-01"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [FL-RON-2020, RON-COMP-00]
    expectDefeated:
      FL-RON-2020: [RON-DEF-00]

  # ---- New York: both boundary sides of the permanent electronic
  # notarization statute (Exec. Law § 135-c), 2023-01-31 per the pack rule
  # (see the TODO(verify) there on the Jan 31 / Feb 1 discrepancy).
  - name: ny-ron-day-before-not-permitted
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/ny-ron-closing/facts
    asOfEffective: "2023-01-30"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  - name: ny-ron-2023-permitted
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/ny-ron-closing/facts
    asOfEffective: "2023-01-31"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [NY-RON-2023, RON-COMP-00]
    expectDefeated:
      NY-RON-2023: [RON-DEF-00]

  # ---- Undefined state: the pack carries no Georgia rule, so the
  # fail-closed default RON-DEF-00 answers (no claim about Georgia law is
  # made — RON is simply not authorized by any rule in this pack).
  - name: ga-ron-undefined-state-fails-closed
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/ga-ron-closing/facts
    asOfEffective: "2026-07-29"
    question: ron:ronPermitted
    expectDecision: { kind: boolean, value: false }
    expectRulesFired: [RON-DEF-00, RON-COMP-01]
    expectDefeated:
      RON-COMP-01: [RON-COMP-00]

  # ---- Method guard: an in-person California notarization today is
  # compliant even though RON is not yet permitted there — RON-COMP-01 is
  # scoped to the RemoteOnline method, so both presumptions survive.
  - name: ca-inperson-2026-compliant
    factsFrom: rulepacks/notarization-ron-us-states/fixtures/ca-inperson-closing/facts
    asOfEffective: "2026-07-29"
    question: ron:notarizationCompliant
    expectDecision: { kind: boolean, value: true }
    expectRulesFired: [RON-DEF-00, RON-COMP-00]
    expectDefeated: {}
