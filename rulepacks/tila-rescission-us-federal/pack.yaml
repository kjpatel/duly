pack:
  name: tila-rescission-us-federal
  version: "2026.2.0"
  ontology: duly-mortgage-closing
  ontologyVersion: "0.1.0"
  description: TILA (Reg Z) right of rescission — applicability, computed deadline, and funding hold.

# ============================================================================
# MODELING BOUNDARY — read before trusting the deadline decision.
#
# 12 CFR § 1026.23(a)(3)(i) sets the rescission deadline at "midnight of the
# third business day following consummation, delivery of the notice required
# by paragraph (b) of this section, or delivery of all material disclosures,
# whichever occurs last." "Business day" here is the PRECISE definition of
# 12 CFR § 1026.2(a)(6): "all calendar days except Sundays and the legal
# public holidays specified in 5 U.S.C. 6103(a)" — which the section's second
# sentence applies expressly "for purposes of rescission under §§ 1026.15 and
# 1026.23." That is a DIFFERENT calendar from the general definition in the
# same paragraph (days the creditor's offices are open): under the precise
# definition SATURDAYS COUNT and Sundays/federal holidays never do.
# Conflating the two definitions is the classic industry bug — a weekday-only
# calendar computes the wrong deadline whenever a Saturday falls inside the
# window.
#
# As of pack 2026.2.0 the rule IR CAN express that computation: the pack
# embeds the precise-business-day calendar below (`calendars:`), and
# RESC-DL-01 COMPUTES the deadline with add_business_days() over the latest
# of the three § 1026.23(a)(3)(i) triggers. resc:fundingPermitted then
# derives from the computed deadline against the evaluation date (an
# `asOf: effective` binding), so the same facts replayed on day 2 and day 4
# still give opposite answers — with no extraction-derived window facts in
# the loop. Earlier versions (<= 2026.1.0) could only CERTIFY the deadline
# printed on the notice against a calendar-day lower bound and ride
# effective-dated resc:rescissionPeriodInForce/Expired window facts for the
# funding flip; replaying a receipt pinned to those versions reproduces that
# behavior, by design.
#
#   * resc:statedRescissionDeadline — the "final date to cancel" printed on
#     the Notice of Right to Cancel (H-8 model form) — remains an EXTRACTED
#     fact, but no rule consumes it any more: the computed deadline stands
#     regardless of what the notice printed. A printed date that disagrees
#     with the computation is an extraction/review concern (the demo surfaces
#     the comparison); giving that reconciliation a first-class decision
#     attribute would need an ontology slot, which is 0.2.0 work for
#     duly-mortgage-closing, not a silent addition here.
#
# THE BOUNDARY MOVED; IT DID NOT VANISH. Still outside this pack:
#   * State-law rescission variants and their calendars.
#   * 5 U.S.C. 6103(b) observance shifting — deliberately EXCLUDED, not
#     merely unmodeled: Official Staff Commentary 2(a)(6)-2 keeps
#     date-specified holidays on their statutory dates for rescission (a
#     Saturday July 4 does NOT make the observed Friday a non-business day).
#   * Calendar coverage: the embedded calendar lists holiday DATES for
#     2026–2027 only. A deadline computation touching any other year fails
#     loudly (kernel ExprCalendarError) rather than silently treating an
#     unlisted holiday as a business day. Extend the calendar (a pack
#     version bump) to widen coverage.
#   * The § 1026.23(f)(2) same-creditor refinancing partial exemption, the
#     § 1026.23(a)(3)(ii)/(h) extended 3-year period when notice or material
#     disclosures are never delivered, § 1026.23(e) consumer waivers, and
#     multi-consumer delivery timing. One loan entity per case (rule-IR v0).
#
# PROTECTIVE DEFAULT — documented choice for missing facts: when any of the
# three trigger-date facts is missing, RESC-DL-01 cannot compute a deadline,
# so the deadline question is a loud no-decision and neither funding rule
# that needs the derived deadline can bind — RESC-FUND-DEF holds funding NOT
# permitted (treat the period as not-yet-expired; § 1026.23(a)(3)(ii) would
# in fact extend the period when notice is never delivered). This pack
# declares no abstentionPolicy: the notice pack already showcases confidence
# floors, and here the protective behavior comes from the default rule,
# which also covers facts that are absent (not merely low-confidence).
# ============================================================================

# The precise rescission business-day calendar of 12 CFR § 1026.2(a)(6):
# "all calendar days except Sundays and the legal public holidays specified
# in 5 U.S.C. 6103(a)". Holiday DATES are the statutory dates for the years
# this calendar covers, computed from the 5 U.S.C. 6103(a) formulas with no
# 6103(b) observance shifting (Official Staff Commentary 2(a)(6)-2) — the
# same table assurance/duly_assurance/generate.py derives independently, and
# a test holds the two reconciled. Versioned with the pack: editing a date
# here is a pack version bump, exactly like editing a rule.
calendars:
  tila-precise:
    description: >-
      12 CFR 1026.2(a)(6) precise business days for rescission: every
      calendar day except Sundays and 5 U.S.C. 6103(a) legal public
      holidays on their statutory dates. Saturdays count.
    excludedWeekdays: [Sunday]
    coverage: { from: "2026-01-01", to: "2028-01-01" }
    holidays:
      - "2026-01-01"  # New Year's Day (January 1)
      - "2026-01-19"  # Birthday of Martin Luther King, Jr. (3rd Monday in January)
      - "2026-02-16"  # Washington's Birthday (3rd Monday in February)
      - "2026-05-25"  # Memorial Day (last Monday in May)
      - "2026-06-19"  # Juneteenth National Independence Day (June 19)
      - "2026-07-04"  # Independence Day (July 4; Saturday — no Friday shift, see header)
      - "2026-09-07"  # Labor Day (1st Monday in September)
      - "2026-10-12"  # Columbus Day (2nd Monday in October)
      - "2026-11-11"  # Veterans Day (November 11)
      - "2026-11-26"  # Thanksgiving Day (4th Thursday in November)
      - "2026-12-25"  # Christmas Day (December 25)
      - "2027-01-01"  # New Year's Day
      - "2027-01-18"  # Birthday of Martin Luther King, Jr.
      - "2027-02-15"  # Washington's Birthday
      - "2027-05-31"  # Memorial Day
      - "2027-06-19"  # Juneteenth National Independence Day
      - "2027-07-04"  # Independence Day (Sunday — already excluded, listed for completeness)
      - "2027-09-06"  # Labor Day
      - "2027-10-11"  # Columbus Day
      - "2027-11-11"  # Veterans Day
      - "2027-11-25"  # Thanksgiving Day
      - "2027-12-25"  # Christmas Day (Saturday — no Friday shift, see header)

decisions:
  - attribute: resc:rescissionApplies
    entityType: resc:Loan
    question: "Does the right of rescission apply to this loan?"
  - attribute: resc:rescissionDeadline
    entityType: resc:Loan
    question: "When does the rescission period end?"
  - attribute: resc:fundingPermitted
    entityType: resc:Loan
    question: "May the lender disburse the loan funds?"

rules:
  # --- Applicability -------------------------------------------------------

  - id: RESC-APP-01
    description: "The right of rescission applies to a credit transaction secured by the consumer's principal dwelling."
    version: "1.0.0"
    priority: 100
    citation:
      text: "12 CFR § 1026.23(a)(1)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(a)(1)"
    effectiveFrom: "2011-12-30"  # 12 CFR part 1026 (CFPB Reg Z restatement) effective date, 76 FR 79768
    given:
      loan:     { entityType: resc:Loan }
      dwelling: { attribute: resc:securedByPrincipalDwelling }
    when:
      - dwelling == true
    then:
      entity: loan
      attribute: resc:rescissionApplies
      value: { kind: boolean, value: true }

  # Priority 110 vs RESC-APP-01's 100: the two rules can never both fire
  # (contradictory guards on the same boolean fact), but the pack validator
  # can only prove disjointness for string-literal equality guards, so the
  # priorities are made distinct to keep the pack provably unambiguous.
  - id: RESC-APP-02
    description: "The right of rescission does not apply when the transaction is not secured by the consumer's principal dwelling."
    version: "1.0.0"
    priority: 110
    citation:
      text: "12 CFR § 1026.23(a)(1)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(a)(1)"
    effectiveFrom: "2011-12-30"
    given:
      loan:     { entityType: resc:Loan }
      dwelling: { attribute: resc:securedByPrincipalDwelling }
    when:
      - dwelling == false
    then:
      entity: loan
      attribute: resc:rescissionApplies
      value: { kind: boolean, value: false }

  # Purchase-money exemption: a "residential mortgage transaction"
  # (§ 1026.2(a)(24): financing the acquisition or initial construction of
  # the dwelling) is exempt under § 1026.23(f)(1) even though it is secured
  # by the principal dwelling — hence the override of RESC-APP-01. This is
  # why refinances and HELOCs with a new creditor carry rescission risk and
  # purchases do not.
  - id: RESC-EXC-RMT
    description: "A residential mortgage transaction (purchase-money financing of the dwelling's acquisition or initial construction) is exempt from the right of rescission."
    version: "1.0.0"
    priority: 200
    citation:
      text: "12 CFR § 1026.23(f)(1); 12 CFR § 1026.2(a)(24)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(f)(1)"
    effectiveFrom: "2011-12-30"
    given:
      loan:   { entityType: resc:Loan }
      txType: { attribute: resc:transactionType }
    when:
      - txType == "Purchase"
    then:
      entity: loan
      attribute: resc:rescissionApplies
      value: { kind: boolean, value: false }
    overrides: [RESC-APP-01]

  # --- Deadline ------------------------------------------------------------

  # The computation the MODELING BOUNDARY header used to disclaim: midnight
  # of the third precise business day (the `tila-precise` calendar above)
  # following the LATEST of the three § 1026.23(a)(3)(i) triggers — max over
  # consummation, notice delivery, and material-disclosures delivery. The
  # concluded date is the deadline DAY; the period runs until midnight of it
  # (the funding rules treat the whole day as inside the period). If any
  # trigger-date fact is missing the rule is inapplicable and the deadline
  # question is a loud no-decision, never a guess.
  - id: RESC-DL-01
    description: "The rescission period runs until midnight of the third business day following the latest of consummation, delivery of the notice of the right to rescind, and delivery of all material disclosures — business days counted under the precise 12 CFR 1026.2(a)(6) calendar (Saturdays count; Sundays and 5 U.S.C. 6103(a) holidays do not)."
    version: "2.0.0"
    priority: 100
    citation:
      text: "12 CFR § 1026.23(a)(3)(i); 12 CFR § 1026.2(a)(6) (precise business-day definition)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(a)(3)(i)"
    effectiveFrom: "2011-12-30"
    given:
      loan:                 { entityType: resc:Loan }
      consummated:          { attribute: resc:consummationDate }
      noticeDelivered:      { attribute: resc:noticeDeliveredDate }
      disclosuresDelivered: { attribute: resc:materialDisclosuresDeliveredDate }
      applies:              { derived: resc:rescissionApplies }
    when:
      - applies == true
    then:
      entity: loan
      attribute: resc:rescissionDeadline
      value: { kind: date, expr: 'add_business_days(max(max(consummated, noticeDelivered), disclosuresDelivered), 3, "tila-precise")' }

  # --- Funding -------------------------------------------------------------

  - id: RESC-FUND-DEF
    description: "Funds are presumed not disbursable until a specific rule shows the rescission period has expired or that no rescission right exists (protective default: an unproven rescission period is treated as not yet expired)."
    version: "1.0.0"
    priority: 0
    citation:
      text: "Protective default presumption; cf. 12 CFR § 1026.23(c)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(c)"
    effectiveFrom: "2011-12-30"
    given:
      loan: { entityType: resc:Loan }
    then:
      entity: loan
      attribute: resc:fundingPermitted
      value: { kind: boolean, value: false }

  # STAY and EXP split on `today <= deadline` / `today > deadline` over the
  # COMPUTED deadline. The guards are contradictory, but the pack validator
  # can only prove disjointness for quoted-string equality guards, so the
  # priorities are made distinct (150 vs 100) to keep the pack provably
  # unambiguous — with the protective side on top. `today` is the calendar
  # date of asOf.effective (an `asOf: effective` binding); the period runs
  # until MIDNIGHT of the deadline day, so the whole deadline day satisfies
  # `today <= deadline` and stays inside the hold.
  - id: RESC-FUND-STAY
    description: "While the rescission period is in force — through midnight of the computed deadline day — no money may be disbursed other than in escrow, no services performed, and no materials delivered."
    version: "2.0.0"
    priority: 150
    citation:
      text: "12 CFR § 1026.23(c)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(c)"
    effectiveFrom: "2011-12-30"
    given:
      loan:     { entityType: resc:Loan }
      deadline: { derived: resc:rescissionDeadline }
      today:    { asOf: effective }
    when:
      - today <= deadline
    then:
      entity: loan
      attribute: resc:fundingPermitted
      value: { kind: boolean, value: false }
    overrides: [RESC-FUND-DEF]

  - id: RESC-FUND-EXP
    description: "Once the rescission period has expired without the consumer rescinding — the evaluation date is past the computed deadline day — the creditor may disburse the loan funds."
    version: "2.0.0"
    priority: 100
    citation:
      text: "12 CFR § 1026.23(c); 12 CFR § 1026.23(a)(3)(i)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(c)"
    effectiveFrom: "2011-12-30"
    given:
      loan:     { entityType: resc:Loan }
      deadline: { derived: resc:rescissionDeadline }
      today:    { asOf: effective }
    when:
      - today > deadline
    then:
      entity: loan
      attribute: resc:fundingPermitted
      value: { kind: boolean, value: true }
    overrides: [RESC-FUND-DEF]

  - id: RESC-FUND-NA
    description: "When no right of rescission applies to the transaction, section 1026.23(c) imposes no funding delay."
    version: "1.0.0"
    priority: 200
    citation:
      text: "12 CFR § 1026.23(a)(1), (f)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23#p-1026.23(f)"
    effectiveFrom: "2011-12-30"
    given:
      loan:    { entityType: resc:Loan }
      applies: { derived: resc:rescissionApplies }
    when:
      - applies == false
    then:
      entity: loan
      attribute: resc:fundingPermitted
      value: { kind: boolean, value: true }
    overrides: [RESC-FUND-DEF]
