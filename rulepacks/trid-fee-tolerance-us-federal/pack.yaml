pack:
  name: trid-fee-tolerance-us-federal
  version: "2026.1.0"
  idPrefix: TRID         # the family every new rule id joins (spec/rule-ir.md, "Rule ids")
  ontology: duly-mortgage-closing
  ontologyVersion: "0.1.0"
  description: TRID (Reg Z) fee tolerance categorization and cure amounts.

decisions:
  - attribute: trid:toleranceCureAmount
    entityType: trid:Fee
    question: "Does this fee increase require a tolerance cure?"
    phrasing:
      - when: { amount: positive }
        verdict: "Cure required"
        detail: "{money} tolerance cure"
        tone: warn
      - verdict: "No cure required"
        detail: "{money}"
        tone: pos
  - attribute: trid:toleranceCategory
    entityType: trid:Fee
    question: "Which tolerance category applied to this fee?"
    phrasing:
      - when: { value: ZeroTolerance }
        verdict: "Zero tolerance"
        detail: "The disclosed amount may not increase at closing"
      - when: { value: TenPercentCumulative }
        verdict: "10% cumulative tolerance"
        detail: "Fee tolerance category"
      - when: { value: NoToleranceLimit }
        verdict: "No tolerance limit"
        detail: "Fee tolerance category"
      # An unmapped code renders as itself rather than as a raw CURIE: the
      # category is named, the claim about what it means is withheld.
      - verdict: "{value}"
        detail: "Fee tolerance category"

rules:
  - id: TRID-DEF-00
    description: "No tolerance cure is owed unless a specific rule computes one."
    version: "1.0.0"
    priority: 0
    citation: { text: "Default presumption" }
    effectiveFrom: "2015-10-03"
    given:
      fee: { entityType: trid:Fee }
    then:
      entity: fee
      attribute: trid:toleranceCureAmount
      value: { kind: money, amount: "0.00", currency: "USD" }

  # Categorization step: transfer taxes are a zero-tolerance charge under
  # 1026.19(e)(3)(i) — the amount disclosed at baseline may not increase at all.
  - id: TRID-CAT-02
    description: "Transfer taxes are a zero-tolerance charge: the amount disclosed on the Loan Estimate may not increase at closing."
    version: "1.0.0"
    priority: 100
    citation:
      text: "12 CFR 1026.19(e)(3)(i)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.19#p-1026.19(e)(3)(i)"
    effectiveFrom: "2015-10-03"
    given:
      fee:     { entityType: trid:Fee }
      feeType: { attribute: trid:feeType }
    when:
      - feeType == "TransferTax"
    then:
      entity: fee
      attribute: trid:toleranceCategory
      value:
        kind: code
        value: "ZeroTolerance"
        codeSystem: "duly-starter-trid/tolerance-categories"
        codeSystemVersion: "0.1.0"

  # Cure computation: for a zero-tolerance fee, any increase over the baseline
  # disclosure is a violation and the excess must be refunded (cured).
  - id: TRID-ZT-01
    description: "When a zero-tolerance fee exceeds its disclosed baseline at closing, the lender owes the borrower the excess as a tolerance cure."
    version: "1.0.0"
    priority: 200
    citation:
      text: "12 CFR 1026.19(e)(3)(i)"
      url: "https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.19#p-1026.19(e)(3)(i)"
    effectiveFrom: "2015-10-03"
    given:
      fee:       { entityType: trid:Fee }
      disclosed: { attribute: trid:disclosedAmountAtBaseline }
      actual:    { attribute: trid:actualAmountAtClosing }
      category:  { derived: trid:toleranceCategory }
    when:
      - category == "ZeroTolerance"
      - actual > disclosed
    then:
      entity: fee
      attribute: trid:toleranceCureAmount
      value: { kind: money, currency: "USD", expr: "actual - disclosed" }
    overrides: [TRID-DEF-00]
