<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">duly architecture</title>
  <desc id="d">Pipeline from source documents through neural extraction adapters into the grounded fact contract, bitemporal fact store, adjudication kernel, and decision receipt, with a review queue, rule packs, and assurance harness alongside.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; font-weight: 400; }
    .lg { font-size: 12px; font-weight: 400; text-anchor: start; fill: #5F5E5A; }
    .ln { stroke: #8A8A85; stroke-width: 1.5; fill: none; }
  </style>
  <rect x="0" y="0" width="680" height="600" rx="10" fill="#FFFFFF"/>

  <rect x="70" y="40" width="320" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="th" x="230" y="63" fill="#444441">Source documents</text>
  <text class="ts" x="230" y="82" fill="#5F5E5A">PDFs, scans, filings</text>

  <line class="ln" x1="230" y1="96" x2="230" y2="120" marker-end="url(#a)"/>

  <rect x="70" y="126" width="320" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="th" x="230" y="149" fill="#3C3489">Extraction adapters (neural)</text>
  <text class="ts" x="230" y="168" fill="#534AB7">document AI, constrained decoding</text>

  <line class="ln" x1="230" y1="182" x2="230" y2="206" marker-end="url(#a)"/>

  <rect x="70" y="212" width="320" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text class="th" x="230" y="235" fill="#712B13">Grounded fact contract</text>
  <text class="ts" x="230" y="254" fill="#993C1D">typed facts, spans, confidence</text>

  <line class="ln" x1="230" y1="268" x2="230" y2="292" marker-end="url(#a)"/>

  <rect x="70" y="298" width="320" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="230" y="321" fill="#085041">Bitemporal fact store</text>
  <text class="ts" x="230" y="340" fill="#0F6E56">effective time × knowledge time</text>

  <line class="ln" x1="230" y1="354" x2="230" y2="378" marker-end="url(#a)"/>

  <rect x="70" y="384" width="320" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="230" y="407" fill="#085041">Adjudication kernel</text>
  <text class="ts" x="230" y="426" fill="#0F6E56">defeasible IR → stratified Datalog</text>

  <line class="ln" x1="230" y1="440" x2="230" y2="464" marker-end="url(#a)"/>

  <rect x="70" y="470" width="320" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="230" y="493" fill="#085041">Decision receipt</text>
  <text class="ts" x="230" y="512" fill="#0F6E56">rule + facts + clauses cited</text>

  <rect x="450" y="212" width="190" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="th" x="545" y="235" fill="#633806">Review queue</text>
  <text class="ts" x="545" y="254" fill="#854F0B">abstentions to humans</text>

  <line class="ln" x1="390" y1="240" x2="446" y2="240" marker-end="url(#a)"/>
  <path class="ln" d="M545 268 V326 H398" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="450" y="384" width="190" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="545" y="407" fill="#085041">Rule packs</text>
  <text class="ts" x="545" y="426" fill="#0F6E56">effective-dated, in git</text>

  <line class="ln" x1="450" y1="412" x2="394" y2="412" marker-end="url(#a)"/>

  <rect x="450" y="470" width="190" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="th" x="545" y="493" fill="#444441">Assurance harness</text>
  <text class="ts" x="545" y="512" fill="#5F5E5A">replay, golden-set CI</text>

  <line class="ln" x1="390" y1="498" x2="446" y2="498" marker-end="url(#a)"/>
  <line class="ln" x1="545" y1="470" x2="545" y2="444" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="70" y="554" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="lg" x="90" y="564">neural</text>
  <rect x="160" y="554" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text class="lg" x="180" y="564">the contract</text>
  <rect x="290" y="554" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="lg" x="310" y="564">deterministic logic</text>
  <rect x="460" y="554" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="lg" x="480" y="564">supporting infra</text>
</svg>
