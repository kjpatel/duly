[project]
name = "duly"
version = "0.0.1"
description = "Auditable document decisioning for regulated workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel/duly_kernel", "store/duly_store", "assurance/duly_assurance"]

[tool.uv]
package = true
