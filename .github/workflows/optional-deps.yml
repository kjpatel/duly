name: Optional dependency suites

# duly's kernel deliberately depends on none of these packages, so their tests
# are marker-gated — and the main CI run therefore *skips* every one of them.
# That means the claims they exist to prove would otherwise go unchecked after
# merge:
#
#   linkml   the committed ontologies are genuine LinkML under real tooling,
#            not merely acceptable to duly's own pure-Python subset validator.
#            This is the one that rots silently: the hot-path validator would
#            keep passing while the artifacts drifted out of spec.
#   z3       the static pack verifier's encoding is sound, no committed pack
#            contains an unproven same-priority overlap, and every what-if
#            answer still agrees with what the kernel actually decides.
#   ortools  the closing-scheduler example still plans a real closing against
#            real adjudications, deterministically, and still gets its hard
#            constraints from receipts rather than from a second copy of the
#            rules. This one is a *worked example*, so its rot is the most
#            embarrassing kind: an example that no longer runs teaches an
#            adopter the opposite of what it claims.
#   docling  the live extraction adapter still emits contract-conformant facts
#            with resolvable spans.
#
# This is a separate workflow on purpose. It installs third-party packages the
# kernel does not require, so it is allowed to be slower and flakier than the
# main suite without blocking a rule-pack PR that cannot affect it.

on:
  push:
    branches: [main]
  pull_request:
    # Only for changes that could actually invalidate one of the claims above.
    # A rule-pack-only PR does not trigger this and pays nothing for it.
    paths:
      - 'kernel/**'
      - 'conformance/**'
      - 'ontologies/**'
      - 'assurance/**'
      - 'whatif/**'
      - 'extraction/**'
      - 'spec/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/optional-deps.yml'
  schedule:
    # Rot does not wait for a merge. Mondays, 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkml:
    name: ontologies are genuine LinkML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Prove the committed ontologies with real LinkML + SHACL tooling
        run: uv run --with linkml --with pyshacl pytest conformance/tests -q -m linkml

  z3:
    name: static pack verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra prove
      - name: Verifier test suite
        run: uv run pytest assurance/tests -q -m z3

      # What-if reuses the verifier's encoding unmodified, so it belongs in
      # the same job: a change to smt.py that broke one would break the other.
      - name: What-if test suite
        run: uv run pytest whatif/tests -q -m z3

      # Deliberately NOT a gate on rule-pack PRs, which is why `rulepacks/**`
      # is absent from the paths filter above. `validate_pack` already refuses
      # any pack with an unproven same-priority overlap and no `overrides`, so
      # a pack that loads cannot make this command fail. It can only fail if Z3
      # refutes a proof `_equality_guards` accepted — a kernel soundness bug.
      # That makes it a differential check between two proof systems, worth
      # running whenever the validator changes (kernel/ is in paths) and on
      # every merge to main, but pointless as a per-pack-PR checkbox.
      - name: Differential check — Z3 against the validator's own proofs
        run: uv run python -m duly_assurance prove rulepacks/*/pack.yaml

  ortools:
    name: closing-scheduler example
    # PR-triggered, unlike `docling`, on a cost argument rather than a
    # principled one: the ortools wheel is ~20 MB and installs in seconds,
    # where the extraction extra pulls torch and costs minutes. An example is
    # also the thing most likely to be broken by an innocent-looking change
    # to the kernel or the spec, so catching it on the PR is worth the seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `--extra prove` as well as `--extra scheduling`: one test in the suite
      # cross-checks the scheduler's swept funding boundary against what-if's
      # solved one. It skips without z3, and a skipped cross-check proves
      # nothing, so this job installs both.
      - run: uv sync --extra scheduling --extra prove
      - name: The example's suite — plan, separation, determinism, degradation
        run: uv run pytest examples/closing-scheduler -q -m ortools
      - name: The example is the demo; run it
        run: uv run python examples/closing-scheduler/schedule.py

      # NOTE for whoever edits a rule pack: `rulepacks/**` is deliberately
      # absent from this workflow's paths filter (see the comment on the z3
      # job), so a pack change that moves the committed plan in
      # `test_scheduler.py::test_the_plan_is_the_committed_demo_output` will
      # surface on the merge to main rather than on the pack PR. That is the
      # same trade the rest of this workflow makes; the fix is a one-line date
      # update in that test, made in the same spirit as a golden regeneration.

  docling:
    name: live Docling adapter
    # Excluded from PRs and from main pushes: the extraction extra pulls torch,
    # so this job costs minutes rather than seconds. Its claim also rots slowly
    # — the adapter contract is stable — so a weekly run is proportionate.
    # Run it on demand from the Actions tab before touching extraction/.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra extraction
      - name: Live adapter emits contract-conformant facts
        run: uv run pytest extraction/tests -q -m docling
